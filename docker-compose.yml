services:
  postgres:
    image: postgres:16-alpine
    container_name: vavive-televisao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vavive_televisao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vavive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vavive_televisao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vavive_postgres_data:
